name: Playwright SauceDemo tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check the complete project
        run: npm run typecheck

      - name: Block high or critical dependency vulnerabilities
        run: npm run audit:dependencies

  playwright:
    name: Playwright / ${{ matrix.environment }} / ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat]
        browser: [chrome, firefox, webkit]
    timeout-minutes: 25
    env:
      CI: true
      ENV: ${{ matrix.environment }}
      BROWSER: ${{ matrix.browser }}
      HEADLESS: true
      BASE_URL: https://www.saucedemo.com
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_LOCKED_USERNAME: ${{ secrets.SAUCE_LOCKED_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run SauceDemo suite for ${{ matrix.environment }} / ${{ matrix.browser }}
        id: tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run "test:${{ matrix.environment }}:${{ matrix.browser }}" 2>&1 | tee .playwright-test.log
          test_exit=${PIPESTATUS[0]}
          set -e
          mkdir -p test-results/evidence
          mv .playwright-test.log test-results/evidence/playwright-test.log
          echo "exit_code=${test_exit}" >> "$GITHUB_OUTPUT"
          exit "${test_exit}"

      - name: Generate Multiple Cucumber HTML report
        if: always()
        run: npm run report:cucumber

      - name: Generate Allure report
        if: always()
        run: npm run report:allure

      - name: Write execution identity
        if: always()
        env:
          EXECUTION_COMMAND: npm run test:${{ matrix.environment }}:${{ matrix.browser }}
        run: node scripts/write-execution-summary.js '${{ steps.tests.outputs.exit_code }}'

      - name: Check artifacts for exposed secrets
        id: secret_scan
        if: always()
        run: npm run verify:secrets

      - name: Publish sanitized security summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-security-${{ matrix.environment }}-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/security/secret-scan-summary.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Publish safe Playwright evidence
        if: ${{ always() && steps.secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ matrix.environment }}-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-results/reports/
            test-results/multiple-cucumber-html-report/
            test-results/allure-report/
            test-results/screenshots/
            test-results/evidence/
            test-results/security/secret-scan-summary.txt
            allure-results/
          if-no-files-found: warn
          retention-days: 90
